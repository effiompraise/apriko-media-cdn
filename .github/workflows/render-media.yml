name: Render Watermarked PNGs and MP4 Reels
on:
  push:
    paths:
      - 'queue/*.manifest.json'

concurrency:
  group: render-media-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render_and_watermark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SVG Renderer & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin fonts-inter
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.sha }}"^ "${{ github.sha }}" -- 'queue/*.manifest.json' > /tmp/batch_manifests.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'queue/*.manifest.json' > /tmp/batch_manifests.txt
          fi
          test -s /tmp/batch_manifests.txt || { echo "No batch manifest found in this push"; exit 1; }
          cat /tmp/batch_manifests.txt

      - name: Render 1080x1350 PNGs & Stamp Logo Watermark
        run: |
          mkdir -p rendered
          while read -r manifest; do
            batch_code=$(jq -r '.batch_code' "$manifest")
            jq -r '.svg_files[]' "$manifest" | while read -r svg_file; do
              [ -f "$svg_file" ] || { echo "Missing SVG: $svg_file"; exit 1; }
              base_name=$(basename "$svg_file" .svg)
              rsvg-convert -w 1080 -h 1350 "$svg_file" -o "rendered/${base_name}.png"

              # Apply the uploaded transparent brand logo as a final watermark.
            if [ -f "brand/logo-watermark.png" ]; then
              ffmpeg -y -i "rendered/${base_name}.png" -i "brand/logo-watermark.png" \
                -filter_complex "[1:v]scale=150:-1[logo];[0:v][logo]overlay=W-w-65:65" \
                "rendered/${base_name}_wm.png"
              mv "rendered/${base_name}_wm.png" "rendered/${base_name}.png"
            fi
            done
          done < /tmp/batch_manifests.txt

      - name: Render Watermarked 1080x1920 MP4 Video Reel (If Reel Manifest Exists)
        run: |
          while read -r manifest; do
            jq -r '.reel_prefixes[]?' "$manifest" | while read -r prefix; do
            [ -n "$prefix" ] || continue
            if [ -f "brand/audio-bg.mp3" ]; then
              ffmpeg -y -framerate 1/4 -pattern_type glob -i "rendered/${prefix}_slide*.png" \
                -i "brand/audio-bg.mp3" -t 16 -r 30 \
                -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:#0B1320,format=yuv420p" \
                -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "rendered/${prefix}.mp4"
            else
              ffmpeg -y -framerate 1/4 -pattern_type glob -i "rendered/${prefix}_slide*.png" \
                -t 16 -r 30 \
                -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:#0B1320,format=yuv420p" \
                -c:v libx264 -pix_fmt yuv420p "rendered/${prefix}.mp4"
            fi
            done
          done < /tmp/batch_manifests.txt

      - name: Write rendering completion markers
        run: |
          mkdir -p rendered/status
          while read -r manifest; do
            batch_code=$(jq -r '.batch_code' "$manifest")
            jq -n --arg batch_code "$batch_code" \
              --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson assets "$(jq '[ (.svg_files[] | sub("^queue/"; "rendered/") | sub("\\.svg$"; ".png")), (.reel_prefixes[]? | "rendered/" + . + ".mp4") ]' "$manifest")" \
              '{batch_code: $batch_code, status: "READY", generated_at: $generated_at, assets: $assets}' \
              > "rendered/status/${batch_code}.json"
          done < /tmp/batch_manifests.txt

      - name: Commit rendered assets and completion markers
        run: |
          git config user.name "Digital Apriko Bot"
          git config user.email "bot@digitalapriko.com"
          git add rendered/ rendered/status/
          git diff --staged --quiet || git commit -m "Auto-render watermarked assets"
          git push
