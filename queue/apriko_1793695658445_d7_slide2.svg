<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bgGrad)"/>
  <rect width="1080" height="16" fill="#FF8C00"/>
  
  <!-- Header -->
  <image href="https://raw.githubusercontent.com/effiompraise/apriko-media-cdn/main/brand/logo-watermark.png" x="80" y="80" width="70" height="70"/>
  <text x="170" y="128" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" letter-spacing="2">DIGITAL APRIKO</text>
  
  <!-- Slide Counter -->
  <rect x="880" y="85" width="120" height="50" rx="25" fill="#FF8C00" fill-opacity="0.15" stroke="#FF8C00" stroke-width="2"/>
  <text x="940" y="120" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FF8C00" text-anchor="middle">02/04</text>
  
  <!-- Core Content Text (Bulletproof Rendering) -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <tspan x="540" y="630">Agitate: Falling</tspan><tspan x="540" y="720">behind competitors.</tspan>
  </text>
  
  <!-- Decorative Line -->
  <rect x="490" y="1050" width="100" height="6" rx="3" fill="#FF8C00"/>
  
  <!-- Footer -->
  <text x="540" y="1140" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="normal" fill="#A0AEC0" text-anchor="middle">High-Converting Websites &amp; AI Automation</text>
  <text x="540" y="1190" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FF8C00" text-anchor="middle">digitalapriko.com</text>
</svg>